# OpenSearch + Dashboards for the slow-query-doctor customer demo.
#
# Up:   docker compose -p slow-query-doctor-env -f env/docker-compose.yml up -d
# Down: docker compose -p slow-query-doctor-env -f env/docker-compose.yml down -v
#
# ALWAYS pass an explicit `-p <project>`: several skills in this repo keep their
# compose files in like-named directories, and without -p Docker Compose derives
# the project from the directory name and can recreate the wrong container.
#
# Binds the API to 9200 and Dashboards to 5601 (standard defaults). On a host
# where 9200 is taken, change the left side of the port maps and point the seed
# script + skill at the new port with OPENSEARCH_URL.
services:
  opensearch:
    image: opensearchproject/opensearch:3.0.0
    container_name: slow-query-doctor-env-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - slow-query-doctor-env-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.0.0
    container_name: slow-query-doctor-env-dashboards
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  slow-query-doctor-env-data:
